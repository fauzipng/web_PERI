        </div>
        <nav class="nav">
          <a class="nav-item" href="dashboard.html">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"

              stroke-linejoin="round"
            >
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span>Dashboard</span>
          </a>
          <a class="nav-item" href="kelola-program.html">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
            <span>Kelola program</span>
          </a>
          <a class="nav-item" href="pendaftar.html">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <span>Pendaftar</span>
          </a>
          <a class="nav-item active" href="buku-tamu.html">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
              ></path>
            </svg>
            <span>Buku tamu</span>
          </a>
          <a class="nav-item" href="kinerja-program.html">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="12" y1="20" x2="12" y2="10"></line>
              <line x1="18" y1="20" x2="18" y2="4"></line>
              <line x1="6" y1="20" x2="6" y2="16"></line>
            </svg>
            <span>Kinerja program</span>
          </a>
        </nav>
      </aside>

      <main class="main">
        <div class="topbar">
          <div>
            <p class="page-title">Buku tamu</p>
            <p class="page-sub">
              <span id="stat-belum-dibaca">0</span> pesan belum dibaca
            </p>
          </div>
          <div class="avatar">A</div>
        </div>

        <div class="toolbar">
          <div
            class="search-box"
            style="position: relative; flex: 1; min-width: 200px"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              style="
                position: absolute;
                left: 10px;
                top: 50%;
                transform: translateY(-50%);
                color: var(--text-muted);
              "
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input
              type="text"
              id="gb-search"
              placeholder="Cari nama atau isi pesan"
              style="width: 100%; padding-left: 32px"
            />
          </div>
          <select
            id="gb-f-kategori"
            style="min-width: 180px"
            aria-label="Filter kategori"
          >
            <option value="">Semua kategori</option>
            <option value="saran">Saran</option>
            <option value="kritik">Kritik</option>
            <option value="pertanyaan">Pertanyaan Program</option>
            <option value="kerjasama">Kerja Sama &amp; Kolaborasi</option>
            <option value="lainnya">Lainnya</option>
          </select>
          <select
            id="gb-f-sentimen"
            style="min-width: 160px"
            aria-label="Filter sentimen"
          >
            <option value="">Semua sentimen</option>
            <option value="positif">Positif</option>
            <option value="netral">Netral</option>
            <option value="negatif">Negatif</option>
          </select>
          <span class="gb-count" id="gb-count"></span>
        </div>

        <div class="panel" id="guestbook-list"></div>
      </main>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
