<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard — PERI Admin</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="dashboard">
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark"></div>
          <div>
            <div class="brand-name">PERI Admin</div>
            <div class="brand-sub">Perempuan Kreatif Indonesia</div>
          </div>
        </div>
        <nav class="nav">
          <a class="nav-item active" href="dashboard.html">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span>Dashboard</span>
          </a>
          <a class="nav-item" href="kelola-program.html">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
            <span>Kelola program</span>
          </a>
          <a class="nav-item" href="pendaftar.html">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <span>Pendaftar</span>
          </a>
          <a class="nav-item" href="buku-tamu.html">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
              ></path>
            </svg>
            <span>Buku tamu</span>
          </a>
          <a class="nav-item" href="kinerja-program.html">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="12" y1="20" x2="12" y2="10"></line>
              <line x1="18" y1="20" x2="18" y2="4"></line>
              <line x1="6" y1="20" x2="6" y2="16"></line>
            </svg>
            <span>Kinerja program</span>
          </a>
        </nav>
      </aside>

      <main class="main">
        <div class="topbar">
          <div>
            <p class="page-title">Dashboard</p>
            <p class="page-sub">Ringkasan aktivitas hari ini</p>
          </div>
          <div class="avatar">A</div>
        </div>

        <div class="stat-grid">
          <div class="stat-card">
            <p class="stat-label">Total pendaftar</p>
            <p class="stat-value" id="stat-pendaftar">0</p>
          </div>
          <div class="stat-card">
            <p class="stat-label">Program aktif</p>
            <p class="stat-value" id="stat-program">0</p>
          </div>
          <div class="stat-card">
            <p class="stat-label">Pesan buku tamu belum dibaca</p>
            <p class="stat-value" id="stat-pesan">0</p>
          </div>
        </div>

        <p class="section-title">Kinerja program</p>
        <div class="panel">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Program</th>
                  <th>Pendaftar</th>
                  <th>Penyelesaian</th>
                  <th>Kepuasan</th>
                </tr>
              </thead>
              <tbody id="kinerja-body"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
